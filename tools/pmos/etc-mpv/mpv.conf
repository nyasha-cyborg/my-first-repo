# n9 (Nexus 9 / Tegra132) defaults. Software decode (hardware VDE decode is work in progress, notes/vde.md):
# 720p H.264 decodes at ~1.1x realtime on both Denver cores, 480p at ~2.1x, so prefer <=480p H.264.
ytdl-format=bestvideo[height<=?480][vcodec^=avc1]+bestaudio/best[height<=?480]/best
vo=gpu
profile=fast
hwdec=no
# skip the deblocking filter on non-key frames when the CPU falls behind (cheap, small quality cost)
vd-lavc-skiploopfilter=nonkey
framedrop=vo
